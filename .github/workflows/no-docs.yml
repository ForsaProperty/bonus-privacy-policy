# Local copy for this PUBLIC repo: a public repo cannot run the private
# ForsaProperty/.github required workflow, so the org ruleset "No docs in repos:
# public repos" requires this job's "no-docs" status check instead.
# Refresh by copying ForsaProperty/.github .github/workflows/no-docs.yml.
# no-docs: company docs live in forsa-vault (vault-mcp https://vault.forsaprop.com/mcp),
# not in git repos. Fails when a PR (or push) ADDS or MODIFIES a doc file outside
# the allowlist. Deletions and renames out of doc paths always pass, so the vault
# migration can remove existing docs; untouched docs never fail.
#
# Doc = *.md *.mdx *.markdown *.rst *.adoc *.pdf *.doc(x) *.ppt(x) *.odt *.rtf,
#       anything non-code in a docs/ or doc/ folder, and loose notes .txt.
# Allowed = README.md (any dir), AGENTS.md, CLAUDE.md, CHANGELOG.md, LICENSE*,
#       .github/**, .claude/{agents,commands,hooks,skills}/** (incl. assets),
#       .claude/settings*.json(.example), test/e2e/fixture dirs, public/static
#       assets, and per-repo globs in .github/no-docs-allow (files code reads).
#
# Callers that want a push-time run: on: push + uses: this file (workflow_call
# passes the caller event through). Enforced org-wide by the "No docs in repos" org ruleset ("Require workflows to
# pass"). Can also be called from a repo: uses: ForsaProperty/.github/.github/workflows/no-docs.yml@main
#
# GENERATED by scripts/build.sh from scripts/no-docs-check.sh. Edit the script, rebuild.
name: no-docs
on:
  pull_request:
  merge_group:
  workflow_call:
permissions:
  contents: read
jobs:
  no-docs:
    name: no-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch commits (trees only, no blobs)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: .github
          persist-credentials: false
      - name: Check for added or modified docs
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          GIT_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/no-docs-check.sh" <<'NODOCS_EOF'
          #!/usr/bin/env bash
          # no-docs-check.sh: ForsaProperty "docs live in forsa-vault" guard.
          #
          # Company docs live in forsa-vault (vault-mcp: https://vault.forsaprop.com/mcp),
          # not in git repos. This script fails when a change ADDS or MODIFIES a doc file
          # outside the allowlist. Deletions and renames *out* of doc paths always pass,
          # so the vault migration can remove existing docs. Untouched docs never fail.
          #
          # Usage:
          #   no-docs-check.sh <base-ref> [<head-ref>]   diff merge-base(base,head)..head (default head: HEAD)
          #   no-docs-check.sh --direct <from> <to>       diff from..to as given (CI: PR merge commit ^1, push before)
          #   no-docs-check.sh --classify <path>...       print BLOCK/ALLOW per path (tests, hooks)
          #   no-docs-check.sh --is-doc <path>            exit 0 if path is a blocked doc, else 1
          #
          # Pure bash + git. No other dependencies. Source of truth:
          #   ForsaProperty/.github  scripts/no-docs-check.sh
          # The reusable workflow .github/workflows/no-docs.yml inlines this file; the
          # per-repo Claude Code hook .claude/hooks/no-new-docs.sh embeds is_doc() too.
          # Edit here, then run scripts/build.sh to regenerate both.

          set -euo pipefail

          VAULT_URL="${VAULT_URL:-https://vault.forsaprop.com/mcp}"

          # --- BEGIN is_doc ---
          NODOCS_ALLOW=()
          load_allow() {  # load_allow <repo-root>
            local f="${1:-.}/.github/no-docs-allow" line
            [[ -f "$f" ]] || return 0
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%%#*}"; line="${line#"${line%%[![:space:]]*}"}"; line="${line%"${line##*[![:space:]]}"}"
              [[ -n "$line" ]] && NODOCS_ALLOW+=("$line")
            done < "$f"
            return 0
          }

          # is_doc PATH -> exit 0 when PATH (repo-relative) is a doc that must live in the vault.
          is_doc() {
            local p="${1#./}" lc base dir
            # bash 3.2 (macOS /bin/bash) has no ${x,,}; fall back to tr there.
            if ((BASH_VERSINFO[0] >= 4)); then lc="${p,,}"; else lc="$(printf '%s' "$p" | tr '[:upper:]' '[:lower:]')"; fi
            base="${lc##*/}"
            if [[ "$lc" == */* ]]; then dir="${lc%/*}/"; else dir=""; fi

            # ---- Allowlist (always fine) ----
            case "$base" in
              readme.md|agents.md|claude.md|claude.local.md|changelog.md) return 1 ;;
              license*|licence*|copying*|notice|notice.*|*-ofl.txt|ofl.txt|*-license.txt) return 1 ;;
            esac
            case "$lc" in
              .github/*) return 1 ;;                                   # issue/PR templates, workflows
              node_modules/*|*/node_modules/*|vendor/*|*/vendor/*) return 1 ;;  # third-party
              # Agent instructions, skills, commands, hooks (incl. their assets) and settings.
              .claude/agents/*|.claude/commands/*|.claude/hooks/*|.claude/skills/*) return 1 ;;
              .claude/settings*.json|.claude/settings*.json.example) return 1 ;;
            esac
            # Per-repo exceptions for files that code reads (ratchet baselines, manifests,
            # served .md): one bash glob per line in .github/no-docs-allow (# = comment).
            local pat
            for pat in ${NODOCS_ALLOW[@]+"${NODOCS_ALLOW[@]}"}; do
              # shellcheck disable=SC2053
              [[ "$p" == $pat ]] && return 1
            done
            # Tests, fixtures and shipped assets may legitimately be any format
            # (a PDF a parser test reads, an e2e journey spec, a vector PDF in an
            # iOS asset catalog, a served /public/auth.md).
            case "/$dir" in
              */fixtures/*|*/__fixtures__/*|*/testdata/*|*/test-data/*|*/test_data/*|*/__snapshots__/*) return 1 ;;
              */test/*|*/tests/*|*/__tests__/*|*/e2e/*|*/spec/*|*/specs/*) return 1 ;;
              */public/*|*/static/*|*.xcassets/*|*/res/raw/*|*/assets/*) return 1 ;;
            esac

            # ---- Doc folders ----
            # docs/ or doc/ at any depth: everything in them is a doc unless the file is
            # code or data (tokens.json, a verify script, a route called "docs" keeps working).
            case "/$dir" in
              */docs/*|*/doc/*)
                case "$base" in
                  *.ts|*.tsx|*.js|*.jsx|*.mjs|*.cjs|*.py|*.go|*.dart|*.kt|*.java|*.swift|*.rb|*.php|*.rs|*.c|*.h|*.cpp|*.cs) return 1 ;;
                  *.css|*.scss|*.sass|*.less|*.vue|*.svelte|*.astro|*.json|*.yml|*.yaml|*.toml|*.sql|*.sh|*.graphql|*.prisma) return 1 ;;
                  *) return 0 ;;
                esac ;;
            esac

            # ---- Doc file types (anywhere, including other .claude/ paths) ----
            case "$base" in
              *.md|*.mdx|*.markdown|*.rst|*.adoc|*.asciidoc) return 0 ;;
              *.pdf|*.doc|*.docx|*.ppt|*.pptx|*.odt|*.odp|*.rtf|*.pages|*.key) return 0 ;;
            esac
            # .claude/: anything else that is not agents/commands/hooks/skills/settings
            # and looks like knowledge (notes, plans, handoffs) counts as a doc.
            case "$lc" in
              .claude/*.txt|.claude/*.org|.claude/*.html) return 0 ;;
            esac

            # ---- Loose notes as .txt ----
            # Config, data, fixtures and web files (robots.txt, requirements.txt, llms.txt,
            # store release notes, url lists) pass. Fail when the name says "notes" or it is
            # a loose .txt at the repo root that is not a known config file.
            case "$base" in
              *.txt)
                case "$base" in
                  *note*|*todo*|*plan*|*handoff*|*hand-off*|*summary*|*meeting*|*minutes*|*brainstorm*|*idea*|*draft*|*scratch*|*context*|*phase*|*memo*|*journal*|*decision*|*roadmap*|*retro*|*transcript*|*howto*|*how-to*|*guide*|*spec.txt|*readme*)
                    case "$dir" in *release-notes/*|*release_notes/*|*/metadata/*|metadata/*) return 1 ;; esac
                    return 0 ;;
                esac
                if [[ -z "$dir" ]]; then
                  case "$base" in
                    requirements*.txt|*-requirements*.txt|constraints*.txt|robots.txt|humans.txt|ads.txt|app-ads.txt|security.txt|llms.txt|llms-full.txt|ai.txt|cmakelists.txt|runtime.txt|version.txt|apt.txt|packages.txt|*.lock.txt) return 1 ;;
                    *) return 0 ;;
                  esac
                fi
                return 1 ;;
            esac
            return 1
          }
          # --- END is_doc ---

          load_allow "${NODOCS_ROOT:-$(git rev-parse --show-toplevel 2>/dev/null || echo .)}"

          if [[ "${1:-}" == "--classify" ]]; then
            shift
            for p in "$@"; do if is_doc "$p"; then echo "BLOCK $p"; else echo "ALLOW $p"; fi; done
            exit 0
          fi
          if [[ "${1:-}" == "--is-doc" ]]; then is_doc "$2"; exit $?; fi

          direct=0
          if [[ "${1:-}" == "--direct" ]]; then direct=1; shift; fi
          base_ref="${1:?usage: no-docs-check.sh [--direct] <base-ref> [<head-ref>]}"
          head_ref="${2:-HEAD}"

          # All-zero SHA = new branch push; there is no base to compare against.
          if [[ "$base_ref" =~ ^0+$ ]]; then echo "no-docs: new ref, nothing to diff."; exit 0; fi

          if ((direct)); then
            mb="$base_ref"
          elif ! mb=$(git merge-base "$base_ref" "$head_ref" 2>/dev/null); then
            echo "no-docs: cannot find merge-base of $base_ref and $head_ref (shallow clone?)." >&2
            exit 2
          fi

          bad=()
          # --no-renames: a rename shows as D(old) + A(new). D is filtered out, so only the
          # NEW path is judged: a rename out of docs/ to a non-doc path passes, a rename
          # into a doc path fails like any added doc.
          while IFS=$'\t' read -r status path; do
            [[ -z "${status:-}" ]] && continue
            if is_doc "$path"; then bad+=("$status	$path"); fi
          done < <(git -c core.quotepath=off diff --no-renames --name-status --diff-filter=ACMT "$mb" "$head_ref")

          if ((${#bad[@]} == 0)); then
            echo "no-docs: OK. No added or modified doc files outside the allowlist."
            exit 0
          fi

          echo "no-docs: FAILED. ${#bad[@]} doc file(s) added or modified in this change."
          echo
          for b in "${bad[@]}"; do
            st="${b%%	*}"; f="${b#*	}"
            echo "  [$st] Docs live in forsa-vault: $VAULT_URL. Move $f there."
            if [[ -n "${GITHUB_ACTIONS:-}" ]]; then echo "::error file=$f::Docs live in forsa-vault: $VAULT_URL. Move $f there."; fi
          done
          echo
          echo "Allowed in repos: README.md, AGENTS.md, CLAUDE.md, CHANGELOG.md, LICENSE*, .github/**,"
          echo ".claude/{agents,commands,hooks,skills}/** and .claude/settings*.json. Deleting docs is always allowed."
          echo "Write the doc with the vault-mcp tools, then drop it from this change (git rm --cached <file>)."
          echo "If code reads this file (a ratchet baseline, a generated manifest), add its path to .github/no-docs-allow."
          exit 1
          NODOCS_EOF
          case "$EVENT" in
            pull_request|pull_request_target)
              # HEAD is the PR merge commit; ^1 is the base tip. Diff = what the PR changes.
              base="$(git rev-parse HEAD^1)" ;;
            merge_group) base="$MG_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) base="$(git rev-parse HEAD^1 2>/dev/null || echo 0)" ;;
          esac
          if [[ ! "$base" =~ ^0+$ ]] && ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git -c "http.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)" \
              fetch -q --depth=1 --filter=blob:none origin "$base"
          fi
          bash "$RUNNER_TEMP/no-docs-check.sh" --direct "$base" HEAD
